[package]
name = "reldex-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `MemoryCredentialStore`, an in-process store for the core's and the UI's
# tests (M2.11, M3.x). Never enabled by a product build: it keeps passwords
# only for the life of the process and exists so tests can exercise every
# `resolve_password` outcome, including a failing store, without touching the
# machine's real credential store.
test-support = []

[dependencies]
# `CredentialKey` (the profile's UUID, ADR-0006 P7) and `Profile`, which
# `resolve_password` reads. Vendor-neutral, no driver. This edge points *down*
# the layers: `reldex-workspace` does not depend on this crate, so the store
# that must never hold a secret cannot reach the code that holds one
# (`tests/dependency_rules.rs`).
reldex-workspace = { path = "../workspace" }

# `Secret`, the redacting, zeroizing password type the driver contract already
# carries into `ConnectionParams`. It lives in the contract crate, not in
# `reldex-workspace`, so both edges are needed.
reldex-db-driver-api = { path = "../db-driver-api" }

# Wipes this crate's own transient buffers — the bytes copied out of the
# platform store, the platform store's own copy before it is freed, and bytes
# that failed to decode — with writes the compiler may not elide (a plain
# `fill(0)` before a free is a dead store it may remove). Licence: Apache-2.0
# OR MIT. Already in the product graph (via `aws-lc-rs`/`der` under the Oracle
# driver, and now `reldex-db-driver-api`'s `Secret`), same version; no
# dependencies of its own with these features. ADR-0007 S6.
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

# Windows Credential Manager (`CredWriteW`/`CredReadW`/`CredDeleteW`/
# `CredFree`), ADR-0007 S4/S7. Licence: MIT OR Apache-2.0 (Microsoft's
# `windows-rs` project, the same project and licence as the `windows` crate
# the owner approved on 2026-09-20, `phase-1.md` §C.3 item 7). `windows-sys`
# rather than `windows`: the four raw function declarations and one struct are
# all this needs, and `windows-sys` is exactly that — no COM/WinRT wrappers,
# no `windows-core`/`windows-result`/`windows-strings` layers — so it compiles
# in a fraction of the time and adds one crate (its only dependency,
# `windows-link` 0.2.1, is already in the graph via `chrono`). Not `keyring`:
# on Windows it wraps these same four calls, and it would put its own
# target-name scheme, error type and (on Linux) a D-Bus stack between Reldex
# and a decision ADR-0007 records. Only on Windows; other targets compile the
# crate without it and get `NoCredentialStore`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Only `tests/dependency_rules.rs`, to parse `cargo metadata` JSON — the same
# use, and the same version, as the other crates' dependency-rule tests.
serde_json = "1"
