[package]
name = "reldex-db-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reldex-db-driver-api = { path = "../db-driver-api" }

[dev-dependencies]
# Used only by tests/dependency_rules.rs to parse `cargo metadata` JSON.
serde_json = "1"
# Test-support driver (docs/architecture/ARCHITECTURE.md §4); see
# tests/dependency_rules.rs for why this dev-only edge is allowed.
reldex-driver-mock = { path = "../drivers/mock" }

# ADR-0004 (M5.1) evidence: bytes per retained row and append cost of three
# result-store representations. A plain binary that prints CSV; it does
# nothing unless `cargo bench` passes it `--bench`. See the file's header.
[[bench]]
name = "result_store_shapes"
harness = false
