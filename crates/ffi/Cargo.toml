[package]
name = "reldex-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "reldex_ffi"
# `cdylib` is what Android loads and what the C smoke harness links (ADR-0003
# D9/D10); `staticlib` is what iOS links directly; `rlib` is what this crate's
# own Rust tests use to call its `extern "C"` functions without going through a
# dynamic loader.
crate-type = ["cdylib", "staticlib", "rlib"]

[lints]
workspace = true

[features]
# The boundary itself is vendor-neutral. The mock driver is a feature and the
# default: spike S15, the C smoke harness (M1.4) and every test here run with no
# database at all. The Oracle thin driver is not a feature: it is always linked
# (see `reldex-driver-oracle-thin` below) and opens through
# `RELDEX_DRIVER_KIND_ORACLE` since ABI 3.3 (M3.3), so a product build is
# `--no-default-features`. Nothing in `src/session.rs`'s session-opening path
# outside `mock.rs` knows which driver it is talking to.
#
# `mock-driver` also turns on `reldex-secrets`'s `test-support` feature
# (`MemoryCredentialStore`), the same way it already turns on the mock database
# driver: both exist so the boundary — and the C smoke harness, on every CI OS
# — can be driven end to end with no real backend (database or OS credential
# store) at all. Neither is compiled into a `--no-default-features` build.
default = ["mock-driver"]
mock-driver = ["dep:reldex-driver-mock", "reldex-secrets/test-support"]
# Opt-in live tests against the Oracle test database (`tools/oracle-test-db/`):
# `RELDEX_IT_PACKAGE=reldex-ffi bash tools/oracle-test-db/run-it.sh
# m3_3_connect_live -- --ignored --test-threads=1`. Compiles nothing into the
# library; off by default so `cargo test --workspace` needs no database
# (`AGENTS.md`, "Testing").
oracle-it = []

[dev-dependencies]
# The tests check fetched cells against the mock's own
# `GeneratedQuerySpec::expected_cell`, so they need the driver crate by name
# even when a future build selects a different driver feature.
reldex-driver-mock = { path = "../drivers/mock" }

[dependencies]
reldex-db-core = { path = "../db-core" }
reldex-db-driver-api = { path = "../db-driver-api" }
reldex-driver-mock = { path = "../drivers/mock", optional = true }
# M2.11 composition root: statement splitting (family 3) is vendor-neutral,
# but metadata (family 4) and settings/profiles/credentials (families 5-7)
# need one concrete driver's binding. Oracle is the only driver today
# (`SPEC.md` §7), so this crate — the one place allowed to name a concrete
# driver (`ARCHITECTURE.md` §2) — depends on it directly for `sid_endpoint`,
# its extension-key constants, its SQL dialect and its `MetadataCatalog`.
# This is independent of `mock-driver` above: none of it opens a database
# connection, so it needs no feature gate of its own and is exercised by the
# default `cargo test --workspace` gate.
reldex-driver-oracle-thin = { path = "../drivers/oracle-thin" }
reldex-sql-text = { path = "../sql-text" }
# The local store (settings, profiles, history, worksheets, layout) and the
# credential store it never touches directly (`reldex-workspace`'s own "no
# secret is ever written to SQLite" rule) — both owned, on their own service
# thread, by the composition root (`workspace.rs`).
reldex-workspace = { path = "../workspace" }
reldex-secrets = { path = "../secrets" }

# No production dependency beyond the vendor-neutral and driver crates above
# (`AGENTS.md`, "do not add production dependencies without documenting why").
# `cbindgen` generates `include/reldex.h` but is a *command-line tool* run by
# `gen-header.sh`, not a build-dependency: making it one would put a parser of
# our own source into every build of the most correctness-critical crate for
# no gain, since the header is committed and verified (ADR-0003 D7).
