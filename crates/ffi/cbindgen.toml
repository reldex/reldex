# Header generation for `crates/ffi/include/reldex.h` (ADR-0003 D7).
#
# The header is generated output that is **committed and verified**: run
# `crates/ffi/gen-header.sh` after changing the ABI, and
# `crates/ffi/tests/header.rs` fails when the committed copy is stale.
#
# `cbindgen` is a command-line tool here, not a build-dependency: the header
# does not change per build, and a parser of our own source has no business
# running inside every build of the most correctness-critical crate.

language = "C"
# Emit both `typedef struct X X;` and `struct X`, so the header is usable from
# C and from C++ without either side guessing.
style = "both"
cpp_compat = true
pragma_once = true
usize_is_size_t = true
documentation = true
documentation_style = "doxy"

header = """
/*
 * reldex.h — the stable C ABI between the C++/Qt adapter and the Reldex core.
 *
 * GENERATED by cbindgen from crates/ffi. Do not edit by hand: run
 * crates/ffi/gen-header.sh and commit the result. CI fails on a stale copy.
 *
 * Contract summary. Each rule is stated in full on the function it belongs to;
 * this is the list to check a port against, not a substitute for reading them.
 * The decision record is docs/decisions/0003-qt-rust-integration.md.
 *
 * VERSION
 *   - Check reldex_abi_version() against RELDEX_ABI_VERSION before anything
 *     else; refuse to start on a major mismatch.
 *   - Every non-opaque struct starts with uint32_t struct_size. Set it to
 *     sizeof(the struct) before every call, in and out.
 *   - Every enum reserves 0 for a value this header predates. Treat an
 *     unknown value as unknown; never assert on it.
 *
 * THREADS
 *   - All calls except reldex_session_request_cancel come from one thread.
 *   - reldex_session_request_cancel may be called from any thread, BUT every
 *     such thread must have returned from it before reldex_hub_destroy. This
 *     library has no internal synchronisation for that; a cancel racing a
 *     destroy dereferences freed memory.
 *   - A fetched ReldexBatch may be read (row/column count, column_info,
 *     column, column_fixed) from several threads at once. It may NOT be read
 *     while it is being released, and a ReldexTextArena is single-threaded.
 *
 * MEMORY
 *   - reldex_batch_column allocates nothing. For NUMBER and TIMESTAMP it
 *     leaves `fixed` NULL and reports only `fixed_stride`: ask for the
 *     element array with reldex_batch_column_fixed, and only if you will read
 *     it. That array costs 46 bytes per NUMBER row and 16 per TIMESTAMP row,
 *     retained until the batch is released — a measured 62.0 B/row on the
 *     three-column S14 shape, about 59 MiB per million rows.
 *   - A terminal, zero-row batch has NO columns: column_count is 0 and every
 *     per-column call reports NOT_FOUND. Read headers with
 *     reldex_session_result_column instead, which answers from EXECUTED.
 *   - A grid that renders cells as text should use reldex_batch_format_column
 *     instead; it writes into an arena you clear per screenful.
 *   - reldex_live_counts() reports how many hubs, sessions, batches, errors
 *     and arenas this library currently holds. It is for tests and
 *     diagnostics: a lifecycle that leaks nothing returns to its baseline.
 *
 * RESULT SETS
 *   - A result's column names and types are available as soon as its EXECUTED
 *     event is drained, from reldex_session_result_column. The strings it
 *     hands out stay valid until YOU submit close_result for that result,
 *     submit close for the session, or call reldex_hub_destroy — and nothing
 *     else ends them, not a failed statement and not a session lost to an
 *     internal panic. hub_destroy frees them on the calling thread before it
 *     returns.
 *   - Executing again does NOT close the previous result. Results stay open,
 *     and keep their server-side cursor, until you close them.
 *
 * THE WAKER
 *   - Fires only on the event queue's transition from empty to non-empty. A
 *     caller that stops draining early gets no further wake and must re-post
 *     its own drain.
 *   - Must not block; must not call ANY reldex_* function, on any hub (the
 *     re-entrancy guard is per thread); must not let a C++ exception escape —
 *     that is undefined behaviour and catch_unwind does NOT contain it.
 *
 * OWNERSHIP AND ERRORS
 *   - A ReldexBatch* and a ReldexError* handed out by an event are YOURS:
 *     release them with reldex_batch_release / reldex_error_free.
 *   - The event queue is unbounded and an undrained batch is your memory.
 *     Bound it by limiting fetches in flight; reldex_hub_pending_events is the
 *     only backlog signal this ABI gives.
 *   - Every function that returns a non-OK ReldexStatus sets the thread-local
 *     last error first, so reldex_last_error_take() after a failure always
 *     describes THAT failure. The error belongs to the thread that made the
 *     failing call.
 *   - Every ReldexStr this library hands OUT is NUL-terminated at ptr[len].
 *     One you build and pass IN need only be len readable bytes.
 */
"""

trailer = """
/* The packed version reldex_abi_version() returns, for the check the adapter
 * makes before anything else. A macro rather than a Rust constant because
 * cbindgen does not evaluate expressions. */
#define RELDEX_ABI_VERSION ((((uint32_t)RELDEX_ABI_VERSION_MAJOR) << 16) | ((uint32_t)RELDEX_ABI_VERSION_MINOR))

/* What reldex_utf16_offset() returns when it cannot answer. Mirrors
 * `RELDEX_UTF16_OFFSET_INVALID` in the Rust crate, which is `usize::MAX`. */
#define RELDEX_UTF16_OFFSET_INVALID ((size_t)-1)
"""

no_includes = true
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]

# Hand-written because cbindgen emits every typedef *above* the `extern "C"`
# block it opens for the functions. In C++ that makes `ReldexWakeFn` a pointer
# to a C++-linkage function, while `reldex_hub_set_waker` — declared inside
# the block — takes a pointer to a C-linkage one. Every mainstream
# implementation treats the two identically, but the standard makes them
# different types, and a header whose entire job is to be portable should not
# have to rely on that. `ReldexWakeFn` is in `[export] exclude` so only this
# definition exists.
after_includes = """

#ifdef __cplusplus
extern "C" {
#endif  // __cplusplus

/**
 * Called when the hub's event queue goes from empty to non-empty.
 *
 * Edge-triggered and coalesced: a burst of completions produces **one** call.
 * It must not block and must not call back into `reldex_*` (ADR-0003 D5); any
 * FFI entry from inside it returns `RELDEX_STATUS_REENTRANT` rather than
 * deadlocking. The C++ trampoline should do exactly one thing:
 * `QMetaObject::invokeMethod(bridge, &Bridge::drain, Qt::QueuedConnection)`.
 *
 * It is called from a Reldex thread, never from the caller's.
 */
typedef void (*ReldexWakeFn)(void *user_data);

/* The C++ standard level, as MSVC also reports it.
 *
 * MSVC leaves __cplusplus at 199711L unless /Zc:__cplusplus is passed, and
 * puts the real value in _MSVC_LANG. A guard that tests __cplusplus alone
 * silently drops the alias below on the compiler most likely to build the
 * adapter, which is worse than not offering it: the code still compiles and
 * the rule it exists to enforce quietly stops being enforced. */
#ifdef __cplusplus
#ifdef _MSVC_LANG
#define RELDEX_CPLUSPLUS _MSVC_LANG
#else
#define RELDEX_CPLUSPLUS __cplusplus
#endif
#endif  // __cplusplus

#if defined(RELDEX_CPLUSPLUS) && RELDEX_CPLUSPLUS >= 201703L
/**
 * `ReldexWakeFn` with the no-exceptions rule made compiler-visible.
 *
 * Letting a C++ exception escape the trampoline is undefined behaviour, and
 * Rust's `catch_unwind` does NOT contain it — so a C++17 adapter should
 * declare its trampoline `noexcept` and hold it in one of these. A `noexcept`
 * function pointer converts to `ReldexWakeFn` implicitly, so
 * `reldex_hub_set_waker` takes it unchanged; the day someone removes the
 * `noexcept`, the assignment stops compiling instead of the process stopping
 * at run time.
 *
 * Defined only under C++17 or later. `RELDEX_CPLUSPLUS` above is the level to
 * test against if you need to know whether you got it.
 */
using ReldexWakeFnNoexcept = void (*)(void *user_data) noexcept;
#define RELDEX_HAVE_WAKE_FN_NOEXCEPT 1
#endif  // C++17

#ifdef __cplusplus
}  // extern "C"
#endif  // __cplusplus
"""

[export]
prefix = ""
# cbindgen emits only what an exported function's signature reaches. These
# types are reached through an `int32_t` field or a `const void*` array
# instead — that is the ABI's design (every enum crosses as an int so an
# unknown value cannot be undefined behaviour, ADR-0003 D6/D7) — so they are
# listed here explicitly. A new enum or mirror struct must be added here or it
# will silently not reach the adapter.
include = [
  "ReldexStatus",
  "ReldexErrorKind",
  "ReldexSessionState",
  "ReldexEventKind",
  "ReldexStatementKind",
  "ReldexCloseOutcome",
  "ReldexColumnKind",
  "ReldexNullable",
  "ReldexNumber",
  "ReldexTimestamp",
  "ReldexTimestampStyle",
  "ReldexBytesStyle",
  "ReldexCancelKind",
  "ReldexCancelOutcome",
  "ReldexCloseDisposition",
  "ReldexDriverKind",
  "ReldexMockScenario",
  "ReldexMockStatement",
  # M2.11 families 2-4 (`crates/ffi/src/event.rs`, `splitter.rs`,
  # `metadata.rs`): the same "crosses only as an `int32_t` field" reason as
  # the block above. Missing from this list since those families first
  # landed -- caught only once the C smoke harness was extended to exercise
  # them, which is why `reldex_split_statements`'s `kind`/`ended_by` and
  # `reldex_metadata_prepare`'s `object_kind`/`kind` compiled and ran fine in
  # Rust the whole time but had no C name to compare against.
  "ReldexCompletedOperation",
  "ReldexServerOutputMode",
  "ReldexSplitKind",
  "ReldexEndedBy",
  "ReldexMetadataRequestKind",
  "ReldexMetadataObjectKind",
  # M2.11 families 5-7 (`crates/ffi/src/workspace.rs`): every one of these
  # crosses only as an `int32_t` field or parameter (`setting_id`, `level`,
  # `ReldexSettingValue::kind`, `ReldexProfileDetails`'s several `_kind`
  # fields, `ReldexHistoryRecordView::outcome_kind`,
  # `ReldexWorkspaceReply::kind`), never by value in a signature cbindgen
  # would otherwise walk to on its own.
  "ReldexSettingId",
  "ReldexSettingLevel",
  "ReldexValueKind",
  "ReldexDatabaseType",
  "ReldexEnvironmentKind",
  "ReldexEndpointKind",
  "ReldexServiceTargetKind",
  "ReldexAuthKind",
  "ReldexPasswordStorageKind",
  "ReldexTransportKind",
  "ReldexSessionRoleKind",
  "ReldexPasswordSourceKind",
  "ReldexPromptReasonKind",
  "ReldexHistoryOutcomeKind",
  "ReldexWorkspaceReplyKind",
]
# Defined by hand in `after_includes`, with C language linkage; see the note
# there. Generating it as well would define it twice.
exclude = ["ReldexWakeFn"]

[enum]
# `ReldexStatus::Ok` becomes `RELDEX_STATUS_OK`.
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false

[parse]
parse_deps = false

[defines]
