name: CI

# Jobs in this workflow: `test` (fmt/clippy/test across the windows/ubuntu/
# macos matrix), `header` (crates/ffi/include/reldex.h staleness check), and
# `doc` (RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps, added
# 2026-09-25 once the whole workspace documented cleanly -- see
# tools/gates.sh's `doc` stage, which runs the same command locally).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests and static checks only, no real database involved. This is
  # deliberately fast and hermetic. Integration tests that need a real
  # Oracle database live in a separate, opt-in job/workflow (not this one)
  # so CI never depends on database availability, network access, or
  # secrets (AGENTS.md "Testing": integration tests requiring a real
  # database must be clearly separated from unit tests).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest GitHub-hosted runners are Apple Silicon (ARM64).
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # ADR-0003 A8: a cargo feature must never change the ABI, and a shipping
      # build carries no mock. Cheap to prove here and easy to break silently.
      - name: cargo clippy -p reldex-ffi --no-default-features
        run: cargo clippy -p reldex-ffi --no-default-features -- -D warnings

  # `crates/ffi/include/reldex.h` is generated output that is committed, so the
  # C++ build never needs cbindgen (ADR-0003 D7). That only works if a stale
  # header cannot land: this job regenerates it and diffs. One runner is
  # enough — the header does not vary by platform — and it is separate from
  # `test` so installing cbindgen does not slow the matrix down.
  #
  # `cargo test --workspace` also runs `crates/ffi/tests/header.rs`, which
  # checks every export reaches the header without needing cbindgen; this job
  # is the exact check.
  header:
    name: reldex.h is not stale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: header

      - name: Install cbindgen
        # Pinned: cbindgen's output changes between releases, so an unpinned
        # install would fail this job on a formatting change nobody made.
        run: cargo install cbindgen --locked --version 0.29.4

      - name: crates/ffi/gen-header.sh --check
        # Invoked through `bash` rather than as `./…` so the job does not
        # depend on the executable bit surviving a checkout made on Windows
        # (this repository has `core.fileMode=false`).
        run: bash crates/ffi/gen-header.sh --check

  # Every crate in the workspace documents cleanly under `-D warnings`
  # (housekeeping/rustdoc-workspace, 2026-09-25). One runner is enough --
  # rustdoc's link resolution does not vary by platform -- and it is
  # separate from `test` so it does not slow the matrix down.
  doc:
    name: cargo doc --workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc

      - name: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
